# Managed by chezmoi (source: ~/dev/dotfiles).
# After editing, run: chezmoi add ~/.tmux.conf  -- otherwise the change is lost
# on the next `chezmoi apply`.

# mouse: click to select pane/window, drag to resize, drag to select text
set -g mouse on

# vi-style keys in copy mode, vim-style pane navigation
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# start windows/panes at 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# kill the Esc delay (annoying in vim/neovim)
set -sg escape-time 0

# true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# let neovim's autoread work inside tmux
set -g focus-events on

# bigger scrollback
set -g history-limit 50000

# reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Reloaded"

# split panes in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Claude Code: highlight windows where Claude is waiting for input.
# @claude_waiting is set/unset by ~/.local/bin/claude-tmux-waiting (Claude hooks).
setw -g window-status-format '#{?@claude_waiting,#[fg=black#,bg=yellow#,bold] #I:#W ● #[default], #I:#W#F }'
setw -g window-status-current-format '#{?@claude_waiting,#[fg=black#,bg=yellow#,bold#,underscore],#[reverse]} #I:#W#F #[default]'
# prefix + a: jump to the first window where Claude is waiting
bind a run-shell "tmux list-windows -a -F '#{session_name}:#{window_index} #{@claude_waiting}' | awk '\$2==1{print \$1; exit}' | xargs -r tmux switch-client -t"
